project:
  type: website
  output-dir: _site
  preview:
    port: 5680
    browser: true
  # Only root-level .qmd files are pages. This deliberately excludes R/,
  # tests/, and the .md files under data-raw/, which Quarto would otherwise
  # render as standalone pages.
  render:
    - "*.qmd"
  resources:
    - images/
    - data/
    - data-raw/

website:
  title: "Heat-Related Deaths"
  description: "A climate indicator tracking deaths classified as heat-related in the United States, rebuilt from EPA's published data."
  back-to-top-navigation: true

  navbar:
    background: dark
    left:
      - text: "Indicator"
        href: index.qmd
      - text: "Data & Downloads"
        href: data.qmd
    right:
      - text: "climateindicators.us"
        href: https://climateindicators.us

  page-footer:
    background: dark
    left: |
      Text and data by the U.S. Environmental Protection Agency, public domain
      (17 U.S.C. 105). This site is an independent rebuild and is not affiliated
      with or endorsed by EPA.
    right:
      - text: "Built with <img src='images/icon-quarto.svg' width=13 style='vertical-align:-1px;margin-right:0.25em'>Quarto"
        href: https://quarto.org/

format:
  html:
    theme: [cosmo, css/theme.scss]
    toc: true
    toc-location: right
    code-fold: true
    code-summary: "Show the code behind this figure"
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false

# Charts are rendered at build time, so code must actually run. The parent
# site's config sets eval: false because it renders no code; inheriting that
# here would silently produce a page of prose with empty gaps where the figures
# should be.
execute:
  echo: true
  eval: true
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: "#>"
    dev: "svg"

fig-retina: 3
